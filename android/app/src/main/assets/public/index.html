<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Sorat POS</title>
  <meta http-equiv="refresh" content="0; url=https://sorat.vercel.app">
  <script>
    if (window.location.protocol === "file:" || window.location.hostname === "localhost") {
      window.location.href = "https://sorat.vercel.app";
    }
  </script>
  <style>
    body {
      background: #09090b;
      color: #f59e0b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(245, 158, 11, 0.2);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2 style="margin: 0; font-size: 18px; font-weight: 800; letter-spacing: 1px;">SORAT POS</h2>
  <p style="margin: 6px 0 0; font-size: 12px; color: #71717a;">Opening Counter Terminal...</p>
</body>
</html>
